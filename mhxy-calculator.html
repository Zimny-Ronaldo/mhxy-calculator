<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>梦幻西游 · 计算工具箱</title>
<style>
/* ============================================================
   统一设计系统
   所有工具共用同一套 CSS 变量与组件类，新增工具直接复用即可
   ============================================================ */
:root{
  --ink:#241f1c; --ink2:#5a5148; --ink3:#8b8175;
  --line:#e3dbcd; --paper:#faf7f1; --card:#fffdf9; --sunken:#f6f2ea;
  --red:#a8262c; --red-bg:#fdeaea;
  --gold:#b8891f; --gold-bg:#fdf6e3;
  --jade:#2c6e5b; --jade-bg:#eef6f2;
  --shadow:0 1px 3px rgba(60,40,20,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-size:15px; line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
}
body::before{                      /* 装饰渐变独立成层，内容重绘不会带着它一起画 */
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image:radial-gradient(circle at 12% -10%,rgba(168,38,44,.07),transparent 45%),
                   radial-gradient(circle at 92% 0%,rgba(184,137,31,.10),transparent 40%);
}
.wrap{max-width:1180px;margin:0 auto;padding:26px 18px 56px}

/* ---- 页头与工具导航 ---- */
header.top{text-align:center;margin-bottom:20px}
header.top h1{margin:0;font-size:27px;letter-spacing:.06em;font-weight:700;
  background:linear-gradient(96deg,var(--red),#d99a2b 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
header.top .sub{margin:8px 0 0;color:var(--ink2);font-size:13.5px}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:18px;
  background:#f2ede3;border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{font:inherit;font-size:13.5px;font-weight:600;letter-spacing:.03em;color:var(--ink2);
  padding:9px 20px;border:none;border-radius:9px;background:transparent;cursor:pointer;transition:background .15s,color .15s}
.tabs button:hover{color:var(--red)}
.tabs button.active{background:#fff;color:var(--red);box-shadow:0 1px 3px rgba(60,40,20,.10)}
@media (max-width:480px){.tabs button{padding:8px 12px;font-size:12.5px}}

/* ---- 卡片与布局 ---- */
.grid{display:grid;gap:18px;align-items:start}
.grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.grid.batch{grid-template-columns:minmax(0,.78fr) minmax(0,1fr) minmax(0,1.28fr)}
.grid.batch .span-all{grid-column:1/-1}
@media (max-width:1060px){
  .grid.batch{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .grid.batch .span-all{grid-column:1/-1}
}
@media (max-width:830px){
  .grid.two,.grid.batch{grid-template-columns:minmax(0,1fr)}
  .grid.batch .span-all{grid-column:auto}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;
  box-shadow:var(--shadow);contain:layout style}
.card h2{margin:0 0 16px;font-size:15px;letter-spacing:.08em;color:var(--red);font-weight:700;
  display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:3px;height:15px;border-radius:2px;background:linear-gradient(var(--red),var(--gold))}

/* ---- 表单 ---- */
label.f,.field-label{display:block;font-size:12.5px;color:var(--ink2);margin:0 0 6px;letter-spacing:.04em}
.field{margin-bottom:15px}
select,input[type=number]{width:100%;padding:10px 12px;font-size:14.5px;font-family:inherit;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:9px;outline:none;transition:border-color .15s}
select:focus,input[type=number]:focus{border-color:var(--gold)}
input[type=number]:disabled{background:#f1ece2;color:#9b9284}
input[type=number]::placeholder{color:#b9b0a2}
.hint{font-size:11.5px;color:var(--ink3);margin-top:5px}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;
  margin:4px 0 0;cursor:pointer;display:block}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--red),var(--gold))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:#fff;border:2px solid var(--red);margin-top:-6.5px}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--red),var(--gold))}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid var(--red)}
.slider-hd{display:flex;justify-content:space-between;align-items:baseline}
.tips{font-size:11.5px;color:#a49a8b;font-variant-numeric:tabular-nums}

.presets{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.chip{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
  background:#fff;color:var(--ink2);cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-bg)}
.bulk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.bulk input[type=number]{width:84px;padding:8px 10px;font-size:14px;text-align:center}
.bulk button{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--ink2);cursor:pointer}
.bulk button:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-bg)}

/* ---- 选项卡（如「修炼类型」）---- */
.opts{display:flex;flex-wrap:wrap;gap:9px}
.opt{flex:1 1 150px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;
  border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;transition:.15s}
.opt:hover{border-color:#d9c9a8}
.opt .n{font-weight:600;display:block;font-size:13.5px}
.opt .t{font-size:11.5px;color:var(--ink2);line-height:1.5}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-bg);box-shadow:0 0 0 2px rgba(184,137,31,.15)}

/* ---- 模式切换 ---- */
.seg{display:inline-flex;background:#f2ede3;border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;margin-bottom:18px}
.seg button{font:inherit;font-size:13.5px;padding:8px 18px;border:none;border-radius:8px;background:transparent;
  color:var(--ink2);cursor:pointer;font-weight:600;letter-spacing:.03em}
.seg button.active{background:#fff;color:var(--red);box-shadow:0 1px 3px rgba(60,40,20,.10)}
@media (max-width:430px){.seg{display:flex;width:100%} .seg button{flex:1;padding:8px 6px;font-size:12.5px}}

/* ---- 结果：统计卡 ---- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stats.one{grid-template-columns:1fr}
@media (max-width:430px){.stats{grid-template-columns:1fr}}
.stat{border-radius:11px;padding:15px 16px;contain:layout paint style;
  background:linear-gradient(160deg,#fff,#fdfaf3);border:1px solid var(--line)}
.stat.tone-jade{background:linear-gradient(160deg,var(--jade-bg),#fff);border-color:#cfe3da}
.stat.tone-gold{background:linear-gradient(160deg,var(--gold-bg),#fff);border-color:#ecd9a8}
.stat.tone-red{background:linear-gradient(160deg,var(--red-bg),#fff);border-color:#f2c9c9}
.stat .k{font-size:12.5px;color:var(--ink2);letter-spacing:.05em}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.01em;margin:4px 0 2px;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.tone-jade .v{color:var(--jade)}
.stat.tone-gold .v{color:var(--gold)}
.stat.tone-red  .v{color:var(--red)}
.stat .sub{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;min-height:1.4em}
.stat.hero{grid-column:1/-1;text-align:center;padding:20px 16px}
.stat.hero .v{font-size:36px;line-height:1.25}

.summary{margin-top:14px;padding:11px 14px;border-radius:9px;background:var(--sunken);border:1px dashed var(--line);
  font-size:13.5px;color:var(--ink2);contain:layout paint style}
.summary b{color:var(--ink)}

.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{font-size:12.5px;background:var(--sunken);border:1px solid var(--line);border-radius:999px;
  padding:4px 12px;color:var(--ink2)}
.pill b{color:var(--gold)}
.pill.warn{background:var(--red-bg);border-color:#f2c9c2;color:#8e2f22}
.pill.warn b{color:var(--red)}

.alert{padding:12px 14px;border-radius:9px;font-size:13.5px;margin-top:14px;
  background:var(--red-bg);border:1px solid #f2c9c9;color:#9b2424}
.idle{padding:26px 16px;text-align:center;color:var(--ink3);font-size:13.5px}

/* ---- 表格 ---- */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px;margin-top:12px}
.table-wrap.tall{max-height:340px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;text-align:right;border-bottom:1px solid #efe9dd}
th:first-child,td:first-child{text-align:left}
th:nth-child(2),td:nth-child(2){text-align:left}
thead th{background:var(--sunken);color:var(--ink2);font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line)}
.table-wrap.tall thead th{position:sticky;top:0;z-index:1}
tbody tr:nth-child(even){background:#fcfaf6}
tr.total td{font-weight:800;border-top:2px solid var(--line);background:var(--gold-bg)!important}
td.op{font-weight:600}
tr.lower td.op{color:var(--red)}
tr.lower td{background:#fdf3f1}
.side-note{font-size:11.5px;color:var(--ink3);margin-top:9px}
/* 降修明细：# 与 操作 要贴在一起。
   表格是自动布局 + width:100%，「合计」那行的 colspan 会把窄的 # 列一起撑开，
   于是序号和操作之间出现一大片空白 —— 把这两列钉成收缩宽度，多余宽度让给右侧数字列。 */
.table-wrap.flow th:first-child,.table-wrap.flow td:first-child,
.table-wrap.flow th:nth-child(2),.table-wrap.flow td:nth-child(2){width:1%;white-space:nowrap}

details{border-top:1px dashed var(--line);margin-top:16px;padding-top:12px}
details > summary{cursor:pointer;font-size:13.5px;color:var(--red);font-weight:600;letter-spacing:.04em;list-style:none}
details > summary::-webkit-details-marker{display:none}
details > summary::before{content:"▸ ";display:inline-block}
details[open] > summary::before{content:"▾ "}

/* ============================================================
   师门技能工具专用组件
   ============================================================ */
.skrow{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:start;
  padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:7px;
  cursor:pointer;transition:border-color .12s,background .12s}
.skrow:hover{border-color:#d8cdb8}
.skrow.off{opacity:.45}
.skrow.active{border-color:var(--red);background:#fffaf7;box-shadow:0 0 0 2px rgba(168,38,44,.10)}
.skrow input[type=checkbox]{width:16px;height:16px;margin:3px 0 0;accent-color:var(--red);cursor:pointer}
.sk-name{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sk-lv{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);margin-top:6px;white-space:nowrap}
.sk-lv input[type=number]{width:84px;padding:7px 9px;font-size:13.5px;text-align:center}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;
  background:var(--gold-bg);color:var(--gold);border:1px solid #ecd9a8}
/* 属性标签（速度/伤害/命中…）：和「主技能」同一套 tag 样式，只换颜色 */
.tag.attr{background:var(--jade-bg);color:var(--jade);border-color:#cfe3da}
.sk-line{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.6}
.sk-line b{color:var(--ink);font-weight:600}

/* 滑条悬停气泡：不点击也能看到当前值 */
.rwrap{position:relative;padding-top:16px;margin-top:-8px}
.rval{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:#fff;
  font-size:11.5px;font-weight:700;line-height:1.55;padding:0 7px;border-radius:6px;white-space:nowrap;
  font-variant-numeric:tabular-nums;pointer-events:none;z-index:2;box-shadow:0 1px 5px rgba(0,0,0,.22)}
.sk-desc{font-size:12.5px;color:var(--ink3);margin-top:3px;line-height:1.65}
.sp-hd{padding-bottom:12px;border-bottom:1px dashed var(--line);margin-bottom:12px}
.sp-hd-name{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp-list{display:grid;gap:10px}
.sp-item{padding:11px 13px;border-radius:9px;background:#f8f5ef;border:1px solid #ece5d8}
.sp-name{font-size:13.5px;font-weight:700;color:var(--ink);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.unlock{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;
  background:var(--jade-bg);color:var(--jade);border:1px solid #cfe3da;white-space:nowrap}
.sp-text{margin-top:6px;font-size:12.5px;color:var(--ink2);line-height:1.7}
.sp-mile{margin-top:8px;padding-top:7px;border-top:1px dashed #e0d7c6;font-size:12.5px;color:var(--ink2);
  display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.sp-mile b{color:var(--ink)}
.mi{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid #ecd9a8;
  border-radius:999px;padding:1px 9px 1px 4px;font-weight:600;color:var(--gold)}
.mi i{font-style:normal;font-size:11px;font-weight:700;background:var(--gold-bg);
  border-radius:999px;padding:0 6px;color:var(--gold)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>梦幻西游 · 计算工具箱</h1>
    <p class="sub">选一个工具开始 · 数据均经交叉核验</p>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </header>
  <main id="host"></main>
</div>

敌方单位一定回合，使其攻击性行为以你为目标。 \n使用条件：“擎天之械”技能达到25级 \n消耗：50点魔法","u":["擎天之械",25]},"诱袭":{"t":"简介：巧用偃术，以逸待劳，诱导指定的敌人发动进攻，反击制胜。 \n功效：挑衅1名敌方目标，使其对你进行物理攻击并触发你的反击。 \n使用条件：“千机奇巧”技能达到45级 \n消耗：70点魔法","u":["千机奇巧",45]},"破击":{"t":"简介：以偃术伏脉敌身，在适当时机激发，对其造成加倍伤害。 \n功效：对敌方单位造成固定伤害。 \n使用条件：“千机奇巧”技能达到1级 \n消耗：（30*作用人数）点魔法","u":["千机奇巧",1]},"匠心·削铁":{"t":"简介：独运巧匠之心，令友伴的兵刃削铁如泥。 \n功效：增加1～5名友方单位本回合造成的所有伤害。 \n使用条件：“匠心不移”技能达到120级且角色飞升 \n消耗：100点魔法","u":["匠心不移",120]},"匠心·固甲":{"t":"简介：独运巧匠之心，令友伴的护甲坚不可摧。 \n功效：减少1～5名友方单位本回合受到的所有伤害。 \n使用条件：“匠心不移”技能达到35级 \n消耗：100点魔法","u":["匠心不移",35]},"匠心·蓄锐":{"t":"简介：独运巧匠之心，令友伴的元气平复如故。 \n功效：回复1～5名友方单位的气血。 \n使用条件：“匠心不移”技能达到25级 \n消耗：80点魔法","u":["匠心不移",25]},"天马行空":{"t":"简介：心至则身至，任天涯海角，瞬息便可回到门派之中。 \n功效：平时状态下使用，可以瞬间回到自己的门派 \n使用条件：“运思如电”技能达到1级 \n消耗：10点气血、10点魔法","u":["运思如电",1]},"鬼斧神工":{"t":"简介：大巧之造，可夺天工，赋予装备惊神泣鬼之能。 \n功效：临时赋予腰带增加封印命中的功效，下线后消失 \n使用条件：“探奥索隐”技能达到35级且角色等级达到30级 \n消耗：和技能等级相同点数的活力","u":["探奥索隐",35]},"移山填海":{"t":"简介：独揽自然之钥，运格物之力以辗轧敌人。 \n功效：克制花果山弟子的必杀技，使用后需要休息1回合，成功率受技能等级与目标等级之差影响 \n使用条件：“探奥索隐”技能达到25级消耗：150点愤怒","u":["探奥索隐",25]}},"skills":[{"name":"神工无形","main":true,"effect":"天机城弟子在施放部分门派法术后会获得一枚【攻之械】或【守之械】，若回合结束时拥有3枚零件，则会进入偃甲状态，大大强化自己的技能。","desc":"大道无形，大巧不工。以神为意，方可御甲万里。此技能是本门修行的基础。","spells":["一发而动"]},{"name":"攻玉以石","main":false,"effect":"","desc":"他山之石，可以攻玉。对友敌双方的深入研究，使你得以捭阖纵横，机变如神。","spells":["针锋相对","攻守易位"]},{"name":"擎天之械","main":false,"effect":"","desc":"吾有偃甲，壮伟无伦，擎天蔽日，威压乾坤。施展此技能，召唤出擎天巨甲，造就一道敌人永难跨越的屏障。","spells":["锋芒毕露"]},{"name":"千机奇巧","main":false,"effect":"提高角色的防御","desc":"偃甲机簧精妙，毫厘之变，可激摇地拔山之能。精于偃术者，伏脉敌方之身，引发其懈怠之时，攻无不克。","spells":["诱袭","破击"]},{"name":"匠心不移","main":false,"effect":"提高角色的伤害","desc":"御甲之人以全部精神贯注其中，方可操纵自如。习至得心应手，便可引领友方攻势。","spells":["匠心·削铁","匠心·固甲","匠心·蓄锐"]},{"name":"运思如电","main":false,"effect":"提高角色的躲避","desc":"心窍开启，如有神助。修习此技能将令你心念如电，义理精要了然于胸。","spells":["天马行空"]},{"name":"探奥索隐","main":false,"effect":"提高角色的法伤和法防","desc":"浩繁辰星，烂漫银河。有景如斯，心岂缚于俗务？引首以望，吾辈意在苍穹。此技能可迫使天地展露其秘密，万物兴歇尽在掌握。","spells":["鬼斧神工","移山填海"]}]},{"name":"花果山","abbr":"HGS","spells":{"威震凌霄":{"t":"简介：灵霄宝殿惊玉皇，十万天军无可挡。被大圣选定的攻击目标，其勇气和攻势将大大减弱。\n功效：对目标造成伤害，并降低目标物理/法术暴击等级。\n使用条件：“神通广大”技能达到120级且角色飞升。\n消耗：100点魔法","u":["神通广大",120]},"气慑天军":{"t":"简介：大闹天宫之际，虽有天军名将，仍震慑于大圣之气势，众人攻势均不能近其要害。\n功效：对自己使用，大量提升抗物理/法术暴击等级。\n使用条件：“神通广大”技能达到120级且角色飞升。\n消耗：100点魔法","u":["神通广大",120]},"当头一棒":{"t":"简介：迎头一棒，直截了当。花果山弟子之威不需掩饰，敢于侵犯者将被予以毫不留情的警告。\n功效：临时提升伤害攻击一个敌方单位，目标气血百分比若处于60%~70%，造成双倍伤害。\n使用条件：“如意金箍”技能达到1级\n消耗：75点魔法","u":["如意金箍",1]},"神针撼海":{"t":"简介：神针撼动，东海倾波，龙宫不稳，海中生灵无一不处在你攻势的笼罩之下。\n功效：对多个目标造成物理伤害。作用目标数=技能等级/35+1，最多5个。\n使用条件：“如意金箍”技能达到1级\n消耗：75点魔法","u":["如意金箍",1]},"杀威铁棒":{"t":"简介：面对敌人的嚣张气焰，花果山弟子的铁棒将大大煞其威风，令其对己攻势减弱。\n功效：临时提升伤害攻击一个敌方单位，并降低目标本回合对自己的伤害。\n使用条件：“如意金箍”技能达到1级\n消耗：75点魔法","u":["如意金箍",1]},"泼天乱棒":{"t":"简介：金箍棒影覆盖整个天穹，热爱逐胜的花果山弟子，不会放过任何一名敌人。\n功效：临时提升伤害攻击一个敌方单位，若目标未死亡，额外溅射多个敌方单位。溅射目标数=技能等级/45+1，最多3个。\n使用条件：“如意金箍”技能达到1级\n消耗：75点魔法","u":["如意金箍",1]},"九幽除名":{"t":"简介：在生死薄上划去自己名字，使得勾魂鬼差无法近身。\n功效：回合结束若处于死亡状态，有一定几率复活，无视锢魂术。成功率受技能等级影响。\n使用条件：“齐天逞胜”技能达到1级\n消耗：75点魔法","u":["齐天逞胜",1]},"移星换斗":{"t":"简介：拥有偷天换地之能，可转换星斗的位置，借此影响自身属性的转变。\n功效：消耗气血恢复自身的魔法。\n使用条件：“齐天逞胜”技能达到15级\n消耗：30点气血","u":["齐天逞胜",15]},"云暗天昏":{"t":"简介：一棒之威，云暗天昏，星落云散，花果山弟子的速度也随这一棒的威力而提升。\n功效：对多个敌方单位造成固定伤害，下回合提升自己的速度。作用目标数=技能等级/35+2，最多6个。\n使用条件：“齐天逞胜”技能达到1级\n消耗：75点魔法","u":["齐天逞胜",1]},"担山赶月":{"t":"简介：力拔山河，肩挑日月，以盖世之力为装备附加力量。\n功效：平时状态下使用，临时赋予项链提高力量的功效，下线后消失。\n使用条件：“金刚之躯”技能达到35级且角色等级达到30级\n消耗：和技能等级相同点数的活力","u":["金刚之躯",35]},"铜头铁臂":{"t":"简介：老君丹炉中练就铜头铁臂，勇猛强悍，刀枪不入。\n功效：给自己增加一个护盾，护盾消失前提升自己的伤害结果。\n使用条件：“金刚之躯”技能达到1级\n消耗：75点魔法","u":["金刚之躯",1]},"无所遁形":{"t":"简介：敌方弱点在你面前无所遁形，利用对方防守之缺陷予以狠狠一击。\n功效：一定回合内获得额外的暴击和忽略防御的能力，可叠加。\n使用条件：“灵猴九窍”技能达到1级\n消耗：75点魔法","u":["灵猴九窍",1]},"天地洞明":{"t":"简介：祭此奇技，霎时间天地洞明，战场一切形势尽收眼中。\n功效：一定回合内，显示双方的剩余气血并缩短每个单位下达指令的时间，最低下降至10秒。\n使用条件：角色化圣\n消耗：1个金鸦火羽、50点魔法"},"除光息焰":{"t":"简介：驾云布雨，止熄魔火，令炼焰失辉。\n功效：克制女魃墓弟子的必杀技。\n使用条件：“灵猴九窍”技能达到25级且角色等级达到20级\n消耗：150点愤怒","u":["灵猴九窍",25]},"呼子唤孙":{"t":"简介：拔下一撮毫毛，一口仙气吹去，猴子猴孙纷纷来助。\n功效：召唤使用物理攻击的巨力神猿协助战斗，每场战斗最多可使用5次。\n使用条件：“七十二变”技能达到10级\n消耗：30点魔法","u":["七十二变",10]},"八戒上身":{"t":"简介：施展七十二般变化之术，将敌人变成一只没有威胁的小猪。\n功效：使用后可以把一个敌方单位变成一只可爱的小猪，并随机驱散一个良性状态。\n使用条件：“七十二变”技能达到45级\n消耗：50点魔法","u":["七十二变",45]},"筋斗云":{"t":"简介：一个筋斗十万八千里，无论在三界任一角落均可瞬间回到门派。\n功效：平时状态下使用，可以瞬间回到自己的门派，成功率受技能等级影响。\n使用条件：“筋斗云”技能达到1级\n消耗：10点气血、10点魔法","u":["筋斗云",1]}},"skills":[{"name":"神通广大","main":true,"effect":"花果山弟子在每回合开始时，将只能使用随机的3个【如意神通】。与NPC的战斗中，普通攻击将会额外攻击一个目标。","desc":"齐天大圣降妖伏魔，嫉恶如仇，其法术之高，神通广大，无所不能。通晓此技能，是本门修行的基础。","spells":["威震凌霄","气慑天军"]},{"name":"如意金箍","main":false,"effect":"按技能等级提高伤害","desc":"大禹治水之定海神针为齐天大圣的随身兵器，乌铁神珍，大小随心。习得此棒法可助力本门弟子给予对手重击，令其不敢小觑。","spells":["当头一棒","神针撼海","杀威铁棒","泼天乱棒"]},{"name":"齐天逞胜","main":false,"effect":"","desc":"齐天大圣之名方可遂悟空之意，闹凌霄、撼东海、戏阎王，无一不为逞胜之举。花果山弟子均继承了此等威仪自信。","spells":["九幽除名","移星换斗","云暗天昏"]},{"name":"金刚之躯","main":false,"effect":"按技能等级提高防御","desc":"孙悟空在太上老君的丹炉中用三昧真火足足炼了七七四十九日，锻成金刚之躯。花果山弟子也继承其坚韧躯体，凡刃不能伤。","spells":["担山赶月","铜头铁臂"]},{"name":"灵猴九窍","main":false,"effect":"按技能等级提高命中","desc":"混沌初分，鸿蒙始辨。花果山孕育仙石，上有九窍八孔，终于见风化作灵明石猴。此猴通变化，识天时，知地利，天地间一切似乎尽在其掌握。","spells":["无所遁形","天地洞明","除光息焰"]},{"name":"七十二变","main":false,"effect":"按等级提高法伤和法防","desc":"地煞之术，该当七十二般变化。可男可女，可老可少，可人可物，变化无穷，习此变化之术，天雷、阴火、赑风均可避之。","spells":["呼子唤孙","八戒上身"]},{"name":"腾云驾雾","main":false,"effect":"","desc":"以云雾飞行于天穹，自在无穷。","spells":["筋斗云"]}]},{"name":"东海渊","abbr":"DHY","spells":{"聆音":{"t":"功效：【被动】进入战斗时，你获得5层梦魇。使用虫之噬、蛙之影和龟之象后会获得等同当前境界层数的梦魇。\n简介：被动技能"},"沉没":{"t":"功效：【被动】回合结束时，若梦魇层数达到10或以上，立刻进入“沉没”境界：你造成所有伤害降低60%且无法进入其他境界，持续到梦魇消失。\n简介：被动技能"},"汹涌":{"t":"功效：【被动】与玩家战斗时，你的虫之噬和蛙之影额外造成24%伤害、海龟石像释放的海龟额外造成24%伤害。\n简介：被动技能"},"蛙之影":{"t":"功效：增进1层境界并进入“蛙之境”，对敌方单个目标造成2次法术伤害，每层境界额外增加1次法术伤害。\n消耗：50点魔法\n简介：进入“蛙之境”：是雨声滴答，还是海浪沙沙？暗影之中层层叠起的巨蛙，伺机待发。"},"虫之噬":{"t":"功效：增进1层境界并进入“虫之境”，对敌方2个目标造成法术伤害，每层境界额外增加1个目标。\n消耗：30点魔法*作用目标数\n简介：进入“虫之境”：触感柔软的梦境，在不知不觉间窒息，感受被海毛虫包围的恐惧吧！"},"龟之象":{"t":"功效：增进1层境界并进入“龟之境”，召唤1个海龟进入海龟石像，每层境界额外召唤1个海龟。每次你使用攻击性法术时，海龟石像会弹出1只海龟追加1次法术伤害。\n消耗：50点魔法\n简介：进入“龟之境”：自远古的石像中来，带着神秘的图腾和无解的诅咒，延续一代又一代，却被世人视为永生。"},"森罗万象":{"t":"功效：对敌方3个目标造成法术伤害。\n使用条件：\"潮汐之咒\"技能达到30级\n消耗：30点魔法*作用目标数\n简介：广袤的海洋中蕴藏了太多秘密，大部分人都对深海的力量一无所知。","u":["潮汐之咒",30]},"海市蜃楼":{"t":"功效：召唤一些动物附身，每召唤1只会获得1层梦魇，直至梦魇达到9层。每只“毛虫”/“巨蛙”/“海龟”附身会令自己：造成伤害提升9%/受到伤害降低9%/速度提升9%，持续3回合。\n使用条件：\"潮汐之咒\"技能达到60级\n消耗：50点魔法\n简介：出现在海中的仙阁，上出重霄，下临无地，如梦似幻，那是可望不可及的美丽。","u":["潮汐之咒",60]},"神游物外":{"t":"功效：平时状态下使用，在门派暗影前使用可进入“修行”状态：修行成功可获得人物经验，修行失败会获得惩罚。\n使用条件：\"潮汐之咒\"技能达到30级\n消耗：每次触发随机事件减2点体力，体力不足经验衰减50%\n简介：东海渊独有的梦境修行之术，梦与海都是没有界限的，因而在修行的途中更要小心走火入魔。","u":["潮汐之咒",30]},"万里烟波":{"t":"功效：退出当前的“虫之境”、“蛙之境”或“龟之境”，有概率清除全部梦魇。\n使用条件：\"澄心之浪\"技能达到30级\n消耗：100点魔法\n简介：即使身怀诅咒，但也拥有着如海一般宽阔的心胸，没有什么是不能放下的。","u":["澄心之浪",30]},"涤荡":{"t":"功效：随机清除3-4层梦魇。\n消耗：100点魔法\n简介：再重的梦魇也会迎来梦醒时分。"},"暗涌":{"t":"功效：每回合结束时消耗666点魔法，并随机清除1-3层梦魇，持续4回合。\n使用条件：\"澄心之浪\"技能达到60级\n消耗：50点魔法\n简介：平静温和的海面下，隐藏了多少不为人知的秘密呢？","u":["澄心之浪",60]},"随波逐浪":{"t":"功效：回门派法术。\n使用条件：\"遨游\"技能达到1级\n消耗：10点气血、10点魔法\n简介：循着先祖的足迹，只要在有海的地方，无论行至多远都能找到回家的路。","u":["遨游",1]}},"skills":[{"name":"深海呓语","main":true,"effect":"","desc":"深海潮汐，暗涌之力，沉睡之时，梦魇将至。此技能是本门修行的基础，东海渊弟子在释放法术后将获得梦魇，需小心提防，否则将陷入无边沉眠。","spells":["聆音","沉没","汹涌"]},{"name":"混沌之谜","main":false,"effect":"按技能等级提高伤害","desc":"蛰伏暗处，自阴影中降临。施展此技后可使用巨蛙的力量。","spells":["蛙之影"]},{"name":"远古之境","main":false,"effect":"按技能等级提高防御","desc":"柔软之躯，吞噬无尽，混沌之息，蚕食梦境。施展此技后可使用海毛虫的力量。","spells":["虫之噬"]},{"name":"长生之祀","main":false,"effect":"按技能等级提高法防","desc":"海洋之息，永生之迷，远古石像，仍引暗潮涌动。施展此技后可使用大海龟的力量。","spells":["龟之象"]},{"name":"潮汐之咒","main":false,"effect":"按技能等级提高魔法","desc":"来自大海深处的神秘律动，在海底如血脉般绵延，刻进每一个海洋生物的生命，却是上古神力遗留下的永恒诅咒。","spells":["森罗万象","海市蜃楼","神游物外"]},{"name":"澄心之浪","main":false,"effect":"按技能等级提高法伤","desc":"大海掀起无尽的波浪，海水的涌动奏响奇妙的乐章，那是每一个东海渊族人关于家乡的记忆，是心中最温暖柔软的地方。","spells":["万里烟波","涤荡","暗涌"]},{"name":"遨游","main":false,"effect":"按技能等级提高躲避","desc":"海洋自创世以来，就对生活在此的生物提供了畅游的权力。学习后可提高躲避。","spells":["随波逐浪"]}]},{"name":"九黎城","abbr":"JLC","spells":{"黎魂":{"t":"功效：【被动】每回合可以释放2~3个师门技能。\n简介：被动技能"},"战鼓":{"t":"功效：【被动】使用师门技能攻击敌人时会累加连击值，连击值越大，下回合“黎魂”触发3个技能概率越高。\n简介：被动技能"},"怒哮":{"t":"功效：【被动】使用一斧开天后如果目标没有处于浮空状态，45%概率获得“怒哮”：临时大幅度增加使用一斧开天和三荒尽灭的浮空成功率。当使用一斧开天令目标成功浮空或者三荒尽灭目标成功浮空时，移除该效果。\n简介：被动技能"},"炎魂":{"t":"功效：【被动】全部种族的属性点加成属性统一按照魔族成长。每回合首次使用师门技能前会临时将自身防御的5%~10%转为伤害力。\n简介：被动技能"},"枫影二刃":{"t":"功效：对敌方单个目标连续发动2次物理攻击，使用后自己有概率获得“怒哮”。\n消耗：20点魔法\n简介：战歌鸣，怒哮起，枫林迎战舞，英魂影重重。"},"一斧开天":{"t":"功效：对敌方单个目标连续发动2次物理攻击，使用后有概率令目标进入“浮空”状态，持续到你的行动结束。\n使用条件：\"兵铸乾坤\"技能达到30级\n消耗：20点魔法\n简介：一斧开天，气破乾坤，以往昔之魄，凝今时之志。","u":["兵铸乾坤",30]},"三荒尽灭":{"t":"功效：对敌方3个目标发动物理攻击，并令所有目标有概率进入“浮空”状态，持续到你的行动结束。\n使用条件：\"燃铁飞花\"技能达到30级\n消耗：20点魔法\n简介：横空霹雳，惊三荒，煞四野，昭吾九黎之威。","u":["燃铁飞花",30]},"铁血生风":{"t":"功效：对敌方单个目标发动物理攻击，如果目标处于“浮空”状态，额外发动1~2次物理攻击。\n使用条件：\"战火雄魂\"技能达到30级\n消耗：20点魔法\n简介：铁血凝矣，挟风而起，敌逢吾威，食尘饮悔。","u":["战火雄魂",30]},"力辟苍穹":{"t":"功效：对敌方全部处于“浮空”状态的目标连续发动2~3次物理攻击，然后取消全部目标的“浮空”状态。\n使用条件：\"魔神降世\"技能达到30级\n消耗：20点魔法\n简介：魔神垂祉，上古魔息浩若狂澜。兵主赐威，穹顶之下唯吾独行。","u":["魔神降世",30]},"故壤归心":{"t":"功效：平时状态下使用，可以瞬间回到自己的门派，成功率受技能等级影响。\n消耗：20点魔法\n简介：疾风骤起，寻归故里，不问天涯，九黎归心。"}},"skills":[{"name":"九黎战歌","main":true,"effect":"无","desc":"战鼓铿锵，战魂不息，九黎之歌荡涤天地，激昂族人之志。","spells":["黎魂","战鼓","怒哮","炎魂"]},{"name":"魂枫战舞","main":false,"effect":"按技能等级提高伤害","desc":"魂枫翩跹，奕奕如战，英气磅礴，永不息止。","spells":["枫影二刃"]},{"name":"兵铸乾坤","main":false,"effect":"按技能等级提高灵力","desc":"九黎魔息，燎天之焰，铸魂成兵，乾坤在握。","spells":["一斧开天"]},{"name":"燃铁飞花","main":false,"effect":"按技能等级提高命中","desc":"战意如火，叱咤生花，九黎之子，铁士无畏。","spells":["三荒尽灭"]},{"name":"战火雄魂","main":false,"effect":"按技能等级提高防御","desc":"九黎之魂，犹燎原之火，燃万丈烈焰，指胜利之巅。","spells":["铁血生风"]},{"name":"魔神降世","main":false,"effect":"无","desc":"聆听兵主密命，得赐魔神之力，战无不胜，天地可征。","spells":["力辟苍穹"]},{"name":"风行九黎","main":false,"effect":"按技能等级提高躲避","desc":"风所行处，九黎无阻，越古穿今，无迹不至。","spells":["故壤归心"]}]},{"name":"弥勒山","abbr":"MLS","spells":{"广结善缘":{"t":"简介：从师闻道，悟彻天命，众生海海，因缘和合。\n功效：获得2点“因果”；队伍中只有自己1个封印流派时（阴曹地府除外），额外获得2点“因果”"},"随心如意":{"t":"简介：正因无穷，福报绵延，随所乐求，一切皆遂。\n功效：1、每回合可消耗因果点由如意灵童使用一次“因果法术”。2、“因果封印”（因果法术中的封印法术）可以与其它封印状态叠加。（包括休息状态）3、拥有因果点上限为6。"},"返本归真":{"t":"简介：诸法空相，见性本真，金羽焚业，善因得种。\n功效：解除自身的封印效果，并获得2点“因果”。消耗金鸦火羽"},"因果·无争":{"t":"简介：封其争伐，如赠慧剑。\n功效：因果法术，使敌方目标无法使用普通攻击，持续1回合。消耗1点因果。"},"因果·戒宝":{"t":"简介：戒其宝光，如证法忍。\n功效：因果法术，使敌方目标无法使用主动法宝，持续1回合。消耗1点因果。"},"因果·止怒":{"t":"简介：止其怒火，如定风波。\n功效：因果法术，使敌方目标无法使用特技，持续1回合。消耗1点因果。"},"因果·释物":{"t":"简介：释其物念，如解尘缚。\n功效：因果法术，使敌方目标无法使用道具，持续1回合。消耗1点因果。"},"以和为贵":{"t":"简介：礼让三分闲，心平百事安，纷争化玉帛，和合众生欢。\n功效：使敌方目标无法使用法术，持续1/2/3/4/5/6回合。（0/25/45/75/100/125级）"},"立地成佛":{"t":"简介：起心动念，因果自缚，放下屠刀，立见禅机。\n功效：消耗所有因果对目标单位进行多次封印，消耗的因果越多，封印种类越多，持续回合数越长。"},"知足常乐":{"t":"简介：无欲得自在，知足生欢喜，得失随缘去，心广天地宽。\n功效：使友方玩家单位下回合禁止使用法术，但使用普通攻击、破血狂攻、琴音三叠造成的伤害提高。"},"大肚能容":{"t":"简介：忍辱得乐，恩怨自消。\n功效：使自己本回合受到的所有伤害降低，且每次受到攻击额外获得3点愤怒。 CD5回合。"},"吉人天相":{"t":"简介：吉光护体，福佑加持。\n功效：解除我方单个目标的“紧箍咒”状态。"},"随遇而安":{"t":"简介：禅悦离外劫，法尘生业障，增减无牵挂，苦乐两相忘。\n功效：使友方玩家单位受到的物理伤害降低80%，受到的法术伤害提高100%且其法术防御降低50%，持续1回合。"},"福至心灵":{"t":"简介：灵光忽现顶，妙法自心生，一念通明处，轻身踏云行。\n功效：平常状态下使用，赋予鞋子提高敏捷的功效，下线后消失。"},"天花乱坠":{"t":"简介：佛法殊胜妙，天华遍虚空，度尽娑婆苦，自在无量光。\n功效：对敌方1（1级）/2（50级）/3（75级）个目标发动物理攻击。（与玩家战斗时伤害为1）"},"一叶菩提":{"t":"简介：叶落三千界，锋回见禅心，菩提本无树，五蕴亦皆空。\n功效：对敌方单个目标发动1次物理攻击，并使自身获得5点愤怒。"},"吃茶去了":{"t":"简介：世事皆纷扰，佛山自清净，不如吃茶去。\n功效：平常状态下使用，可以瞬间回到自己的门派。"}},"skills":[{"name":"缘起法随","main":true,"effect":"其他门派技能的等级不能高于本技能。","desc":"诸法因缘生，诸法因缘灭。","spells":["广结善缘","随心如意","返本归真"]},{"name":"善果圆成","main":false,"effect":"","desc":"善因结善果，圆满自成就。","spells":["因果·无争","因果·戒宝","因果·止怒","因果·释物","以和为贵"]},{"name":"慈悲为怀","main":false,"effect":"按技能等级提高灵力","desc":"习得修行妙法门，慈心自度有缘人。","spells":["立地成佛","知足常乐"]},{"name":"福慧无量","main":false,"effect":"按技能等级提高防御","desc":"褔如般若清凉月，慧比金刚不坏身。","spells":["大肚能容","吉人天相"]},{"name":"欢喜自在","main":false,"effect":"按技能等级提高速度","desc":"无拘亦无束，破障似拂尘。","spells":["随遇而安","福至心灵"]},{"name":"光明净土","main":false,"effect":"按技能等级提高伤害","desc":"无拘亦无束，破障似拂尘。","spells":["天花乱坠","一叶菩提"]},{"name":"来去自如","main":false,"effect":"按等级提高躲避","desc":"穿梭红尘里，不染自在身。","spells":["吃茶去了"]}]}],"milestones":{"龙卷雨击":[[25,"秒 2"],[50,"秒 3"],[75,"秒 4"],[100,"秒 5"],[125,"秒 6"],[150,"秒 7"]]}}</script>

<script id="engine-skill">
/** 师门技能引擎工厂：传入数据岛，返回纯计算函数 */
function SkillEngine(data){
const EXP = data.cost.exp, GOLD = data.cost.gold;
const MAXLV = EXP.length;                       // 180
const SECTS = data.sects;
const MILE = data.milestones || {};

/**
 * 1-30 级官方**只收金钱、不收经验**（官方工具箱接口实测：0→30 = 经验 0 / 金钱 26,291）。
 * ⚠️ 只在这里置 0，**不要改数据岛里那 30 个经验值** —— 生活技能引擎（engine-lifeskill）
 * 用的是同一张表，而帮派书院那 1-30 级是照收经验的（官方帮派接口实测）。
 */
const FREE_EXP_UNTIL = 30;
const expOf = L => (L <= FREE_EXP_UNTIL ? 0 : EXP[L-1]);

function costOf(from, to){
  let exp = 0, gold = 0;
  for (let L = from + 1; L <= to; L++){ exp += expOf(L); gold += GOLD[L-1]; }
  return { exp, gold, levels: Math.max(0, to - from) };
}
/** 每 5 级归为一档；支持多段区间合并 */
function bandsOf(ranges){
  const map = new Map();
  for (const [from, to] of ranges){
    for (let L = from + 1; L <= to; L++){
      const k = Math.ceil(L / 5);
      let b = map.get(k);
      if (!b){ b = { k, lo:L, hi:L, exp:0, gold:0 }; map.set(k, b); }
      if (L < b.lo) b.lo = L;
      if (L > b.hi) b.hi = L;
      b.exp += expOf(L); b.gold += GOLD[L-1];
    }
  }
  return [...map.values()].sort((x, y) => x.k - y.k);
}
function spellsOf(sect, skill){
  return (skill.spells || []).map(name => {
    const rec = sect.spells[name] || {};
    return { name, text: rec.t || '', unlock: rec.u || null, milestones: MILE[name] || null };
  });
}

  return { MAXLV, SECTS, costOf, bandsOf, spellsOf };
}
</script>

<script id="engine-xiulian">
/** 人物修炼引擎：同一个参数化状态机覆盖三种修炼类型 */
const XiulianEngine = (() => {
const expAt = n => (n * n + 3 * n + 11) * 10;                 // 升到 n 级所需经验
const expSum = (a, b) => { let s = 0; for (let n = a + 1; n <= b; n++) s += expAt(n); return s; };

// 类型的唯一差异：单价 + 上限 + 是否可降修
const TYPES = [
  { id:'atk',  name:'攻修 / 法修', tag:'攻击修炼 · 法术修炼 · 3 万/次', perClick:30000, capMax:25, canLower:true  },
  { id:'def',  name:'防御 / 抗法', tag:'防御修炼 · 抗法修炼 · 2 万/次', perClick:20000, capMax:25, canLower:true  },
  { id:'hunt', name:'猎术修炼',    tag:'提升捕捉成功率 · 3 万/次 · 上限 20', perClick:30000, capMax:20, canLower:false },
];
const BASE_CAP = 20;

function compute(type, level, cap, target){
  const rate = type.perClick / 10;
  const out = { ok:true, flow:[], newExp:0, sunkExp:0, newMoney:0, sunkMoney:0,
                lowerCount:0, capFinal:cap, levelFinal:level, levelAfterLower:level, notice:'', error:'' };
  const money = e => e * rate;

  if (target > type.capMax){
    out.ok = false;
    out.error = `${type.name}的修炼上限为 ${type.capMax} 级，无法提升到 ${target} 级。`;
    return out;
  }
  if (target <= level){
    out.notice = `目标等级（${target} 级）不高于当前等级（${level} 级），无需提升，花费 0。`;
    return out;
  }

  let L = level, C = cap, i = 0;
  while (C < target){
    if (L < C - 1){                                  // 距上限太远，先点修贴上去
      const e = expSum(L, C - 1);
      out.flow.push({ i:++i, op:'点修', level:`${L} → ${C - 1}`, cap:String(C), money:money(e), sunk:0 });
      out.newExp += e; L = C - 1;
    }
    const lost = expAt(L);                           // 降修：上限 +1、等级 −1，被降掉那级的投入作废
    out.flow.push({ i:++i, op:'降修', level:`${L} → ${L - 1}`, cap:`${C} → ${C + 1}`, money:0, sunk:money(lost) });
    out.sunkExp += lost; out.lowerCount++; L--; C++;
  }
  out.capFinal = C; out.levelAfterLower = L;
  if (L < target){
    const e = expSum(L, target);
    out.flow.push({ i:++i, op:'点修', level:`${L} → ${target}`, cap:String(C), money:money(e), sunk:0 });
    out.newExp += e; L = target;
  }
  out.levelFinal = L;
  out.newMoney = money(out.newExp);
  out.sunkMoney = money(out.sunkExp);
  return out;
}

  return { expAt, expSum, TYPES, BASE_CAP, compute };
})();
</script>


<script id="engine-qianyuan">
/**
 * 乾元丹引擎
 *
 * 数据是当前版本的 9 个大丹逐丹消耗表（人物经验 / 金钱），直接写死。
 * 第 8 个比第 7 个便宜、第 9 个比第 8 个便宜，是官方数值本身如此，不是算错。
 */
const QianyuanEngine = (() => {
  /** 9 个大丹：人物等级门槛 + 逐丹消耗 */
  const DAN = [
    { n:1, level:69,  exp:22341872, money:4468371  },
    { n:2, level:89,  exp:27846728, money:5569343  },
    { n:3, level:109, exp:34534248, money:6906847  },
    { n:4, level:129, exp:42519680, money:8503933  },
    { n:5, level:155, exp:51918272, money:10383652 },
    { n:6, level:159, exp:62845272, money:12569051 },
    { n:7, level:164, exp:75415928, money:15083183 },
    { n:8, level:168, exp:75977600, money:15195518 },
    { n:9, level:171, exp:72201200, money:14440238 },
  ];
  const MAX = DAN.length;

  /** 人物等级最多能开几个乾元丹 */
  function capForLevel(lv){
    let c = 0;
    for (const d of DAN) if (lv >= d.level) c = d.n;
    return c;
  }

  /** 从「已有 from 个」点到「第 to 个」的累计消耗（含 to） */
  function costBetween(from, to){
    let exp = 0, money = 0;
    const steps = [];
    for (let n = Math.max(0, from) + 1; n <= Math.min(to, MAX); n++){
      const d = DAN[n - 1];
      exp += d.exp; money += d.money;
      steps.push(d);
    }
    return { exp, money, steps, count: steps.length };
  }

  /** 手上 exp 点经验、已有 from 个丹，最多还能再开几个 */
  function maxAffordable(from, exp){
    let left = exp, got = 0, money = 0, i = Math.max(0, Math.min(from, MAX));
    while (i < MAX && left >= DAN[i].exp){ left -= DAN[i].exp; money += DAN[i].money; got++; i++; }
    const next = i < MAX ? DAN[i] : null;
    return {
      got, total: Math.max(0, Math.min(from, MAX)) + got,
      spentExp: exp - left, spentMoney: money, leftExp: left,
      next, shortOf: next ? next.exp - left : 0,
    };
  }

  return { DAN, MAX, capForLevel, costBetween, maxAffordable };
})();
</script>

  const specExp = L => 20000 * L * L + 200000 * L + 1500000 + 8000000 * Math.max(0, L - 40);

  /** 升到第 L 级这一级的花费 */
  function stepOf(skill, L){
    if (L < 1 || L > skill.cap) return { exp:0, money:0 };

      case 'qiang': return { exp: L <= 120 ? sectExp[L-1] : EXP_QIANG[L-121], money: MONEY[L-1] };

        ? { exp: sectExp[L-1], money: MONEY[L-1] }
        : { exp: EXP_CRAFT[L-151], money: TAIL_CRAFT[L-151] };
      case 'ling':  return L <= 80
        ? { exp: sectExp[L+14], money: MONEY_LING[L-1] }
        : { exp: EXP_LING[L-81], money: MONEY_LING[L-1] };

  function costBetween(id, from, to){

    let exp = 0, money = 0;
    for (let L = a + 1; L <= b; L++){ const s = stepOf(skill, L); exp += s.exp; money += s.money; }
    return {
      skill, from:a, to:b, count: Math.max(0, b - a),
      exp, money,
      bgUsed: b > a ? (a + 1 + b) * (b - a) / 2 : 0,   // Σ(a+1..b)
      bgNeed: 5 * b,                                   // 每级需持有 5L，整段取目标等级那一次
    };
  }

  /** 每 5 级一档的明细（对齐到 5 的倍数，与师门技能同一口径） */
  function bandsOf(id, from, to){
    const skill = skillById(id);
    const a = Math.max(0, Math.min(Number(from) || 0, skill.cap));
    const b = Math.max(0, Math.min(Number(to)   || 0, skill.cap));
    const out = [];
    for (let L = a + 1; L <= b; L++){
      const key = Math.ceil(L / 5) * 5;
      let band = out[out.length - 1];
      if (!band || band.hi !== Math.min(key, b)){
        band = { lo:L, hi:Math.min(key, b), exp:0, money:0, bgUsed:0 };
        out.push(band);
      }
      const s = stepOf(skill, L);
      band.exp += s.exp; band.money += s.money; band.bgUsed += L;
    }
    return out;
  }

  return { SKILLS, skillById, stepOf, costBetween, bandsOf };
};

<script>
/* ============================================================
   0. 基础设施 —— 全工具共用
   ============================================================ */
const $ = (sel, root = document) => root.querySelector(sel);

/** 所有进入 innerHTML 的数据字符串都过这里 */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

const fmt = {
  /** 千分位整数 */
  num: n => Math.round(n).toLocaleString('en-US'),
  /** 中文数量级：亿（最多 4 位小数）/ 万（最多 2 位小数），末尾 0 去掉并加千分位 */
  cn(n){
    const v = Number(n) || 0, a = Math.abs(v);
    const trim = s => s.replace(/\.?0+$/, '');
    const sep = s => { const [i, d] = s.split('.'); return Number(i).toLocaleString('en-US') + (d ? '.' + d : ''); };
    if (a >= 1e8) return sep(trim((v / 1e8).toFixed(4))) + ' 亿';
    if (a >= 1e4) return sep(trim((v / 1e4).toFixed(2))) + ' 万';
    return fmt.num(v);
  },
  /** 每帧最多渲染一次 */
  raf(fn){
    let done = false;
    return () => { if (done) return; done = true; requestAnimationFrame(() => { done = false; fn(); }); };
  },
};

/* ============================================================
   1. UI 组件库 —— 统一的视觉语言，所有工具复用
   ============================================================ */
const ui = {
  card({ title = '', body = '', cls = '' } = {}){
    return `<section class="card ${cls}">${title ? `<h2>${esc(title)}</h2>` : ''}${body}</section>`;
  },
  field({ label, id, hint = '', value = '', attrs = '', tag = 'input' } = {}){
    const control = tag === 'select'
      ? `<select id="${id}" ${attrs}></select>`
      : `<input type="number" id="${id}" inputmode="numeric" step="1" value="${esc(value)}" ${attrs}>`;
    return `<div class="field">
      <label class="f" for="${id}">${esc(label)}</label>
      ${control}
      <div class="hint" id="${id}-hint">${esc(hint)}</div>
    </div>`;
  },
  /** 统计卡：items = [{k, v, sub, tone}] */
  stats(items, { hero = false } = {}){
    const cls = items.length === 1 ? 'stats one' : 'stats';
    return `<div class="${cls}">${items.map(i => `
      <div class="stat${i.tone ? ' tone-' + i.tone : ''}${i.hero ? ' hero' : ''}">
        <div class="k">${esc(i.k)}</div>
        <div class="v">${i.v}</div>
        <div class="sub">${i.sub || ''}</div>
      </div>`).join('')}</div>`;
  },
  pills(items){
    return `<div class="pills">${items.map(p =>
      `<span class="pill${p.tone === 'warn' ? ' warn' : ''}">${p.text}</span>`).join('')}</div>`;
  },
  /** 行可以是裸数组 [c1, c2]，也可以是 { cells:[…], cls }；cell 支持 {text, cls} */
  table({ head = [], rows = [], total = null, cls = '' } = {}){
    const cell = c => (c && typeof c === 'object' && !Array.isArray(c)
      ? `<td class="${c.cls || ''}">${c.text}</td>` : `<td>${c}</td>`);
    const row = r => {
      const rr = Array.isArray(r) ? { cells: r } : r;
      return `<tr class="${rr.cls || ''}">${(rr.cells || []).map(cell).join('')}</tr>`;
    };
    return `<div class="table-wrap ${cls}"><table>
      <thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>
        ${rows.map(row).join('')}
        ${total ? `<tr class="total">${total.map(cell).join('')}</tr>` : ''}
      </tbody></table></div>`;
  },
  alert(text){ return `<div class="alert">${text}</div>`; },
  idle(text){ return `<div class="idle">${esc(text)}</div>`; },
  seg(items, activeId){
    return `<div class="seg" role="tablist">${items.map(i =>
      `<button type="button" data-seg="${i.id}" class="${i.id === activeId ? 'active' : ''}">${esc(i.name)}</button>`).join('')}</div>`;
  },
  opts(items, activeId){
    return `<div class="opts">${items.map(i =>
      `<button type="button" class="opt" data-opt="${i.id}" aria-pressed="${i.id === activeId}">
        <span class="n">${esc(i.name)}</span><span class="t">${esc(i.tag || '')}</span>
      </button>`).join('')}</div>`;
  },
};

// ============================================================
// 2. 工具注册表 —— 新增计算器只需 Tools.register(...)
//
// 新增一个工具的完整步骤：
//   ① 数据大的话，加一个数据岛：
//        <script type="application/json" id="data-xxx">{...}<\/script>
//   ② 计算逻辑写成无 DOM 的引擎块，插到主程序之前：
//        <script id="engine-xxx">function XxxEngine(data){ /* ... */ return { ... }; }<\/script>
//      （这样 tests/engine.test.mjs 能直接抽出来对拍）
//   ③ 在下面注册一个工具：
//        Tools.register({
//          id: 'xxx', name: '工具名', tagline: '一句话说明',
//          dataId: 'data-xxx',          // 没有数据岛就写 null
//          create(ctx){
//            // ctx = { host, data, ui, fmt, esc, $, invalidate }
//            //   host        本工具根节点，直接往里面写 innerHTML
//            //   data        数据岛解析结果（dataId 为 null 时是 null）
//            //   ui          统一组件库 card/field/stats/pills/table/seg/opts/alert/idle
//            //   fmt         num / cn / raf
//            //   invalidate  节流到下一帧重绘本工具
//            host.innerHTML = ui.card({ title: '…', body: '…' });
//            return { render(){ /* 把当前状态画出来 */ } };
//          },
//        });
//
// 约定：工具之间互相不可见、不共享状态；共享的只有 ui / fmt / esc 这三个纯工具。
//      切换工具不会重建已加载的工具，所以各自的输入状态天然保留。
// ============================================================
const Tools = (() => {
  const list = [];
  let active = null, host = null;

  /** each tool: { id, name, tagline, dataId, create(ctx) -> { render } } */
  function register(tool){ list.push(tool); }

  function dataOf(id){
    const node = id && document.getElementById(id);
    return node ? JSON.parse(node.textContent) : null;
  }

  function mount(id){
    const tool = list.find(t => t.id === id) || list[0];
    if (!tool) return;

    if (!tool._root){
      const root = document.createElement('div');
      root.className = 'tool tool-' + tool.id;
      host.appendChild(root);
      const invalidate = fmt.raf(() => { if (tool._inst) tool._inst.render(); });
      const ctx = { host: root, data: dataOf(tool.dataId), ui, fmt, esc, $, invalidate };
      tool._root = root;
      tool._inst = tool.create(ctx);
    }
    list.forEach(t => { if (t._root) t._root.hidden = (t !== tool); });
    active = tool;

    [...document.querySelectorAll('#tabs button')].forEach(b =>
      b.classList.toggle('active', b.dataset.tool === tool.id));
    location.hash = tool.id;

    if (tool._inst) tool._inst.render();
  }

  function boot(hostEl){
    host = hostEl;
    document.getElementById('tabs').innerHTML = list.map(t =>
      `<button type="button" data-tool="${t.id}" role="tab">${esc(t.name)}</button>`).join('');
    document.getElementById('tabs').addEventListener('click', e => {
      const b = e.target.closest('button[data-tool]');
      if (b) mount(b.dataset.tool);
    });
    const wanted = (location.hash || '').replace('#', '');
    mount(list.some(t => t.id === wanted) ? wanted : list[0].id);
  }

  return { register, boot, mount, list };
})();

Tools.register({
  id: 'xiulian',
  name: '人物修炼',
  tagline: '攻/法、防/抗法、猎术的修炼花费与降修损失',
  dataId: null,
  create(ctx){
    const { host, esc, fmt, ui, $, invalidate } = ctx;

    /* ---------- 引擎：调用独立引擎块 ---------- */
    const { TYPES, BASE_CAP, compute } = XiulianEngine;

    /* ---------- 状态与骨架 ---------- */
    const state = { typeId: TYPES[0].id, lvTrimmed: null };   // lvTrimmed = 当前等级被夹到上限时记住那个上限
    const typeOf = id => TYPES.find(t => t.id === id) || TYPES[0];

    host.innerHTML = `<div class="grid two">
      <div class="card">
        <h2>修炼类型与等级</h2>
        <div id="xl-opts"></div>
        <div style="margin-top:16px">
          <div class="field">
            <label class="f" for="xl-lv">当前修炼等级</label>
            <input type="number" id="xl-lv" inputmode="numeric" step="1" placeholder="">
            <div class="hint" id="xl-lv-hint"></div>
          </div>
          <div class="field">
            <label class="f" for="xl-cap">当前修炼上限</label>
            <input type="number" id="xl-cap" inputmode="numeric" step="1">
            <div class="hint" id="xl-cap-hint"></div>
          </div>
          <div class="field" style="margin-bottom:0">
            <label class="f" for="xl-target">目标修炼等级</label>
            <input type="number" id="xl-target" inputmode="numeric" step="1">
            <div class="hint" id="xl-target-hint"></div>
          </div>
        </div>
      </div>
      <div class="card">
        <h2>计算结果</h2>
        <div id="xl-result"></div>
      </div>
    </div>`;

    const el = {
      opts: $('#xl-opts', host), lv: $('#xl-lv', host), cap: $('#xl-cap', host), target: $('#xl-target', host),
      lvHint: $('#xl-lv-hint', host), capHint: $('#xl-cap-hint', host), targetHint: $('#xl-target-hint', host),
      result: $('#xl-result', host),
    };

    const intOrNull = node => { const v = parseInt(node.value, 10); return Number.isFinite(v) ? v : null; };
    const clamp = (v, a, b) => Math.min(Math.max(v, a), b);

    function read(){
      const t = typeOf(state.typeId);
      let cap = t.canLower ? intOrNull(el.cap) : BASE_CAP;
      let lv = intOrNull(el.lv);
      let target = intOrNull(el.target);
      const incomplete = lv === null || target === null || cap === null;
      if (cap !== null) cap = clamp(cap, BASE_CAP, t.capMax);
      if (lv !== null) lv = clamp(lv, 0, cap === null ? t.capMax : cap);
      if (target !== null) target = clamp(target, 0, t.capMax);
      return { t, lv, cap, target, incomplete };
    }
    function renderOpts(){
      el.opts.innerHTML = ui.opts(TYPES.map(t => ({ id:t.id, name:t.name, tag:t.tag })), state.typeId);
    }
    /** 切类型：**保留**已输入的修炼值，只把猎术的上限框钉回 20 */
    function syncCapForType(){
      if (!typeOf(state.typeId).canLower) el.cap.value = String(BASE_CAP);
    }
    /** 当前生效的上限：猎术固定 20；上限框空着时返回 null（此时不夹当前等级） */
    function effCap(){
      const t = typeOf(state.typeId);
      if (!t.canLower) return BASE_CAP;
      const raw = intOrNull(el.cap);
      return raw === null ? null : clamp(raw, BASE_CAP, t.capMax);
    }
    /**
     * 当前修炼等级不能超过当前修炼上限（游戏里的硬约束）：超了就**就地**夹到上限。
     * 只在用户正在编辑「当前等级」时调用，能顺手清掉不再需要的提示。
     */
    function trimLvOnEdit(){
      const cap = effCap(), raw = intOrNull(el.lv);
      if (cap !== null && raw !== null && raw > cap){ el.lv.value = String(cap); state.lvTrimmed = cap; }
      else state.lvTrimmed = null;
    }
    /** 被动夹紧（上限被改小 / 换类型）：只记录提示，不清提示 */
    function trimLvAgainstCap(){
      const cap = effCap(), raw = intOrNull(el.lv);
      if (cap !== null && raw !== null && raw > cap){ el.lv.value = String(cap); state.lvTrimmed = cap; }
    }
    /** 只更新范围提示 / 占位 / 禁用态，绝不碰用户正在输入的值 */
    function applyMeta(t, r){
      el.cap.disabled = !t.canLower;
      const capNow = r.cap === null ? t.capMax : r.cap;
      el.lv.min = '0';       el.lv.max = String(capNow);      el.lv.placeholder = `0 ~ ${capNow}`;
      el.cap.min = String(BASE_CAP); el.cap.max = String(t.capMax); el.cap.placeholder = `${BASE_CAP} ~ ${t.capMax}`;
      el.target.min = '0';   el.target.max = String(t.capMax); el.target.placeholder = `0 ~ ${t.capMax}`;
      el.lvHint.textContent = `可填 0 ~ ${capNow}`;
      el.capHint.textContent = t.canLower ? `可填 ${BASE_CAP} ~ ${t.capMax}` : '猎术上限固定 20 级，不适用降修';
      el.targetHint.textContent = `可填 0 ~ ${t.capMax}`;
    }
    /**
     * 失焦 / 回车时才把超范围的值夹紧写回（空值保持为空）。
     * 绝不能在 input 事件里做：上限下限是 20，逐字输入「20」时敲下 "2" 就被夹成 20，
     * 再敲 "0" 变成 200 又被夹成 25 —— 用户永远填不进 20。
     */
    function commitInputs(){
      const t = typeOf(state.typeId), r = read();
      if (!t.canLower) el.cap.value = String(BASE_CAP);
      else if (r.cap !== null) el.cap.value = String(r.cap);
      if (r.lv !== null) el.lv.value = String(r.lv);
      if (r.target !== null) el.target.value = String(r.target);
      applyMeta(t, r);
    }

    function render(){
      renderOpts();
      const inp = read();
      applyMeta(inp.t, inp);                             // 只刷提示，不改输入值
      const { t, lv, cap, target, incomplete } = inp;

      // 当前等级被夹到上限时如实说明，绝不默默按另一个数字算
      const trimmed = state.lvTrimmed === null ? '' : ui.alert(
        `⚠️ 当前修炼等级不能超过当前修炼上限（${state.lvTrimmed} 级），已按 ${state.lvTrimmed} 级计算。`);

      if (incomplete){                                   // 没填完就不算，避免一进来就砸一堆数字
        el.result.innerHTML = ui.idle('填写左侧三项数据后自动计算') + trimmed;
        return;
      }
      const r = compute(t, lv, cap, target);
      if (!r.ok){ el.result.innerHTML = trimmed + ui.alert('⚠️ ' + esc(r.error)); return; }

      let html = trimmed + ui.stats([{
        k: '需要花费', tone: 'gold', hero: true,
        v: fmt.cn(r.newMoney), sub: `${fmt.num(r.newMoney)} 梦幻币`,
      }]);
      html += `<div class="summary"><b>${esc(t.name)}</b> ：${lv} 级 → ${target} 级` +
              (r.lowerCount ? `（上限 ${cap} → ${r.capFinal}）` : '') + `</div>`;
      if (r.notice) html += ui.alert(esc(r.notice));

      if (r.lowerCount > 0){
        html += ui.pills([
          { text: `降修 <b>${r.lowerCount}</b> 次` },
          { text: `上限 <b>${cap} → ${r.capFinal}</b>` },
          { text: `降修后 <b>${r.levelAfterLower} 级</b>` },
          { text: `降修沉没损失 <b>${fmt.cn(r.sunkMoney)}</b>`, tone:'warn' },
        ]);
        html += ui.table({
          cls: 'tall flow',
          head: ['#', '操作', '修炼等级', '修炼上限', '本步花费', '沉没损失'],
          rows: r.flow.map(f => ({
            cls: f.op === '降修' ? 'lower' : '',
            cells: [f.i, { text:f.op, cls:'op' }, f.level, f.cap,
                    f.money ? fmt.cn(f.money) : '—', f.sunk ? fmt.cn(f.sunk) : '—'],
          })),
          total: [{ text:`合计（终态 ${r.levelFinal} 级 / 上限 ${r.capFinal}）`, colspan:4 }, fmt.cn(r.newMoney), fmt.cn(r.sunkMoney)],
        });
      }
      el.result.innerHTML = html;
    }

    /* ---------- 交互 ---------- */
    el.opts.addEventListener('click', e => {
      const b = e.target.closest('[data-opt]'); if (!b) return;
      state.typeId = b.dataset.opt;
      state.lvTrimmed = null;                            // 换类型先撤掉旧提示
      syncCapForType();                                  // 猎术上限钉回 20（其余原样保留）
      trimLvAgainstCap();                                // 新上限可能更低，超了就地夹
      invalidate();
    });
    el.lv.addEventListener('input', () => { trimLvOnEdit(); invalidate(); });   // 当前等级：超上限就地夹 + 提示
    el.cap.addEventListener('input', () => {
      if (intOrNull(el.cap) === null) state.lvTrimmed = null;                   // 上限被清空，提示作废
      invalidate();
    });
    el.target.addEventListener('input', () => invalidate());
    [el.lv, el.cap, el.target].forEach(node => {
      // 失焦/回车：夹紧写回；上限变化还要顺带把「当前等级 ≤ 上限」重新夹一次
      node.addEventListener('change', () => { trimLvAgainstCap(); commitInputs(); invalidate(); });
      node.addEventListener('blur',   () => { trimLvAgainstCap(); commitInputs(); invalidate(); });
    });

    return { render };
  },
});

      list: $('#sk-list', host), spells: $('#sk-spells', host),
      err: $('#sk-err', host), stats: $('#sk-stats', host), summary: $('#sk-summary', host),
      batchBox: $('#sk-batch-box', host), detail: $('#sk-detail', host),
      detailSum: $('#sk-detail-sum', host), bandBox: $('#sk-band-box', host),
    };

    let builtSect = -1, bandKey = null, bandTimer = null;
    const setIf = (node, v) => { if (String(node.value) !== String(v)) node.value = v; };

    /* ---------- 填写状态：null = 还没填，填完才算 ---------- */
    const toInt = v => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : null; };
    const clampInt = (v, a, b) => Math.min(Math.max(v, a), b);
    const ready = r => r.from !== null && r.to !== null;

    /**
     * 滑条悬停气泡：鼠标移到滑条上（还没点）就**预览这个位置会选到几级**，不改动实际值。
     * 反算：把光标 x 映射到 [min,max]，按 step 吸附；气泡位置按预览值对应的滑块中心算
     * left = pct% ± (9 − 18×pct)px（9 = 滑块半径，18 = 滑块直径，与 CSS 一致）
     */
    function bindRangeBubble(range, bubble){
      let dragging = false;
      const THUMB = 18, R = THUMB / 2;
      const bounds = () => {
        const min = +range.min || 0, max = +range.max || 100, step = +range.step || 1;
        return { min, max, step };
      };
      const valueAt = clientX => {
        const { min, max, step } = bounds();
        const rect = range.getBoundingClientRect();
        const usable = Math.max(1, rect.width - THUMB);          // 轨道可用宽
        const pct = Math.min(1, Math.max(0, (clientX - rect.left - R) / usable));
        const snapped = Math.round((min + pct * (max - min) - min) / step) * step + min;
        return Math.min(max, Math.max(min, snapped));
      };
      const show = v => {
        const { min, max } = bounds();
        const pct = Math.min(1, Math.max(0, (v - min) / (max - min || 1)));
        const off = R - THUMB * pct;
        bubble.textContent = v;
        bubble.style.left = `calc(${(pct * 100).toFixed(3)}% ${off < 0 ? '-' : '+'} ${Math.abs(off).toFixed(2)}px)`;
        bubble.hidden = false;
      };
      const onMove = e => show(Number.isFinite(e && e.clientX) ? valueAt(e.clientX) : +range.value);
      range.addEventListener('mouseenter', onMove);
      range.addEventListener('mousemove',  onMove);
      range.addEventListener('input',      () => { if (!bubble.hidden) show(+range.value); });  // 拖动/键盘改值时同步
      range.addEventListener('mousedown',  () => { dragging = true; });
      range.addEventListener('mouseup',    () => { dragging = false; });
      range.addEventListener('mouseleave', () => { if (!dragging) bubble.hidden = true; });
      // 拖到滑条外面松手时也要能收起（迷你 DOM 没有 document.addEventListener，跳过即可）
      if (typeof document.addEventListener === 'function')
        document.addEventListener('mouseup', () => { if (dragging){ dragging = false; bubble.hidden = true; } });
    }
    /** 写入一个端点；两项都填了才统一夹紧（保证 当前 < 目标） */
    function putLevel(target, which, raw){
      const v = String(raw ?? '').trim();
      const n = v === '' ? null : toInt(v);
      target[which] = n === null ? null
        : which === 'from' ? clampInt(n, 0, MAXLV - 1) : clampInt(n, 1, MAXLV);
      if (ready(target)){
        const f = normalize(target.from, target.to, which);
        target.from = f.from; target.to = f.to;
      }
    }

    bindRangeBubble(el.fromR, el.fromV);
    bindRangeBubble(el.toR, el.toV);

    /* ---------- 渲染 ---------- */
    function renderMode(){
      const batch = state.mode === 'batch';
      [...host.querySelectorAll('[data-seg]')].forEach(b => b.classList.toggle('active', b.dataset.seg === state.mode));
      el.panelSingle.hidden = batch;
      el.panelBatch.hidden  = !batch;
      el.cardSkills.hidden  = !batch;
      el.cardSpells.hidden  = !batch;
      el.grid.classList.toggle('batch', batch);
      el.grid.classList.toggle('two', !batch);
      el.title.textContent = batch ? '门派与统一设置' : '等级区间';
    }

    /**
     * 技能说明精简成属性标签（跟「主技能」同样的 tag 样式，换个颜色）：
     *   「按技能等级提高躲避力」「按技能等级提伤害力」「按等级提高躲避」「提高角色的躲避」→「躲避」
     *   「按等级提高法伤和法防」→「法伤」「法防」
     * 数据里 4 种前缀都覆盖了；长句说明（花果山/天机城主技能等）与「无」返回 []，不占位置。
     * 末尾的「力」只在超过两个字时去掉，好让「伤害力/伤害」统一成「伤害」，同时保住「灵力」。
     */
    const ATTR_RE = /^(?:按(?:技能)?等级提(?:高)?|提高角色的?)(.+)$/;
    function attrTags(effect){
      const m = ATTR_RE.exec(String(effect || '').trim());
      if (!m) return [];
      return m[1].split(/[和、,]/).map(s => s.trim()).filter(Boolean)
        .map(t => (t.length > 2 && t.endsWith('力')) ? t.slice(0, -1) : t);
    }

    function renderSkillList(){
      const idx = state.batch.sect;
      if (builtSect === idx) return;
      builtSect = idx;
      const sect = SECTS[idx];
      el.list.innerHTML = sect.skills.map((k, i) => {
        const r = state.batch.rows[i], n = esc(k.name);
        const tags = attrTags(k.effect).map(a => `<span class="tag attr">${esc(a)}</span>`).join('');
        return `<div class="skrow${r.on ? '' : ' off'}${state.batch.active === i ? ' active' : ''}" data-i="${i}">
          <input type="checkbox" ${r.on ? 'checked' : ''} aria-label="${n}">
          <div>
            <div class="sk-name" role="button" tabindex="0">${n}${
              k.main ? '<span class="tag">主技能</span>' : ''}${tags}</div>
            <div class="sk-lv">
              <input type="number" class="lv-from" min="0" max="179" step="1" value="${r.from === null ? '' : r.from}" placeholder="0 ~ 179" aria-label="${n} 当前等级">
              <span>→</span>
              <input type="number" class="lv-to" min="1" max="180" step="1" value="${r.to === null ? '' : r.to}" placeholder="1 ~ 180" aria-label="${n} 目标等级">
            </div>
          </div>
        </div>`;
      }).join('');
    }

    function renderSpellPanel(){
      const sect = SECTS[state.batch.sect];
      const skill = sect.skills[state.batch.active] || sect.skills[0];
      if (!skill){ el.spells.innerHTML = ui.idle('请选择技能'); return; }
      const spells = spellsOf(sect, skill);
      const head = `<div class="sp-hd">
          <div class="sp-hd-name">${esc(skill.name)}${skill.main ? '<span class="tag">主技能</span>' : ''}</div>
          ${skill.effect ? `<div class="sk-line" style="margin-top:6px"><b>提升：</b>${esc(skill.effect)}</div>` : ''}
          ${skill.desc   ? `<div class="sk-desc">${esc(skill.desc)}</div>` : ''}
        </div>`;
      if (!spells.length){
        el.spells.innerHTML = head + ui.idle('该技能没有独立法术，主要提供属性加成。');
        return;
      }
      el.spells.innerHTML = head + `<div class="sp-list">${spells.map(sp => `
        <div class="sp-item">
          <div class="sp-name">${esc(sp.name)}${
            sp.unlock ? `<span class="unlock">${esc(sp.unlock[0])} 达 ${sp.unlock[1]} 级可学</span>` : ''}</div>
          <div class="sp-text">${sp.text.split('\\n').map(l => `<div>${esc(l)}</div>`).join('')}</div>
          ${sp.milestones ? `<div class="sp-mile"><b>等级里程碑：</b>${
            sp.milestones.map(([lv, eff]) => `<span class="mi"><i>${lv}</i>${esc(eff)}</span>`).join('')
          }</div>` : ''}
        </div>`).join('')}</div>`;
    }

    function scheduleBands(ranges, key){
      if (key === bandKey) return;
      if (!el.detail.open){ bandKey = key; return; }
      clearTimeout(bandTimer);
      bandTimer = setTimeout(() => {
        const bands = bandsOf(ranges);
        el.bandBox.innerHTML = ui.table({
          cls: 'tall',
          head: ['等级区间', '金钱', '经验', '钱/经验'],
          rows: bands.map(b => ({
            cells: [b.lo === b.hi ? `${b.lo}` : `${b.lo} – ${b.hi}`,
                    fmt.num(b.gold), fmt.num(b.exp),
                    { text: (b.gold / b.exp).toFixed(3), cls: 'side-note' }],
          })),
        });
        el.detailSum.textContent = `消耗明细（每 5 级一档，共 ${bands.length} 档）`;
        bandKey = key;
      }, 110);
    }

    function render(){
      renderMode();
      el.summary.hidden = false;                  // 空 div 会露出虚线框，待填写时单独隐藏

      if (state.mode === 'single'){
        const { from, to } = state.single;
        setIf(el.from, from === null ? '' : from);
        setIf(el.to,   to   === null ? '' : to);
        setIf(el.fromR, from === null ? 0 : from);
        setIf(el.toR,   to   === null ? 1 : to);
        el.err.hidden = true;
        el.batchBox.hidden = true;
        if (from === null || to === null){          // 没填完不算，避免一进来就砸一堆数字
          el.stats.innerHTML = ui.idle('填写当前等级与目标等级后自动计算');
          el.summary.hidden = true;
          el.detail.hidden = true;
          bandKey = null;
          return;
        }
        el.detail.hidden = false;
        const r = costOf(from, to);
        el.stats.innerHTML = ui.stats([
          { k:'消耗金钱', v: fmt.cn(r.gold), sub: fmt.num(r.gold), tone:'gold' },
          { k:'消耗经验', v: fmt.cn(r.exp),  sub: fmt.num(r.exp),  tone:'jade' },
        ]);
        el.summary.innerHTML = `<b>${from}</b> 级 → <b>${to}</b> 级，共 <b>${r.levels}</b> 级<br>` +
          `平均每级 金钱 <b>${fmt.num(r.gold / r.levels)}</b> · 经验 <b>${fmt.num(r.exp / r.levels)}</b>`;
        scheduleBands([[from, to]], `${from}|${to}`);
        return;
      }

      /* ---------- 批量 ---------- */
      renderSkillList();
      renderSpellPanel();
      const sect = SECTS[state.batch.sect];
      const rows = activeRows();

      [...el.list.querySelectorAll('.skrow')].forEach(node => {
        const i = +node.dataset.i, r = state.batch.rows[i];
        node.classList.toggle('off', !r.on);
        node.classList.toggle('active', state.batch.active === i);
        const cb = node.querySelector('input[type=checkbox]');
        if (cb.checked !== r.on) cb.checked = r.on;
        setIf(node.querySelector('.lv-from'), r.from === null ? '' : r.from);
        setIf(node.querySelector('.lv-to'),   r.to   === null ? '' : r.to);
      });

      const filled = rows.filter(ready);            // 勾选且等级填完的才算

      if (!filled.length){                          // 没填完不算
        el.stats.innerHTML = ui.idle('填写各技能等级后自动计算');
        el.summary.innerHTML = `<b>${esc(sect.name)}</b>：` + (rows.length
          ? `已选 <b>${rows.length}</b> 个技能，但等级还没填`
          : '尚未勾选任何技能');
        el.batchBox.hidden = true;
        el.detail.hidden = true;
        bandKey = null;
        el.detailSum.textContent = '消耗明细';
        el.bandBox.innerHTML = '';
        return;
      }
      el.detail.hidden = false;

      let totalExp = 0, totalGold = 0, totalLevels = 0;
      const lines = filled.map(r => {
        const c = costOf(r.from, r.to);
        totalExp += c.exp; totalGold += c.gold; totalLevels += c.levels;
        return { r, c };
      });
      el.stats.innerHTML = ui.stats([
        { k:'消耗金钱', v: fmt.cn(totalGold), sub: fmt.num(totalGold), tone:'gold' },
        { k:'消耗经验', v: fmt.cn(totalExp),  sub: fmt.num(totalExp),  tone:'jade' },
      ]);
      el.summary.innerHTML = `<b>${esc(sect.name)}</b> · 已选 <b>${rows.length}</b> / 7 个师门技能，` +
        (filled.length < rows.length ? `其中 <b>${filled.length}</b> 个已填等级` : `共 <b>${totalLevels}</b> 级`);
      el.batchBox.hidden = false;
      el.batchBox.innerHTML = ui.table({
        cls: 'tall',
        head: ['师门技能', '区间', '金钱', '经验'],
        rows: lines.map(({ r, c }) => ({
          cells: [`${esc(r.skill.name)}${r.skill.main ? ' <span class="tag">主</span>' : ''}`,
                  `${r.from} → ${r.to}`, fmt.num(c.gold), fmt.num(c.exp)],
        })),
        total: ['合计', `${filled.length} 个技能`, fmt.num(totalGold), fmt.num(totalExp)],
      });
      scheduleBands(filled.map(r => [r.from, r.to]), filled.map(r => r.from + '-' + r.to).join('|'));
    }

    /* ---------- 交互 ---------- */
    const onSingle = (which, raw) => { putLevel(state.single, which, raw); invalidate(); };
    el.from.addEventListener('input',  () => onSingle('from', el.from.value));
    el.to.addEventListener('input',    () => onSingle('to',   el.to.value));
    el.fromR.addEventListener('input', () => onSingle('from', el.fromR.value));
    el.toR.addEventListener('input',   () => onSingle('to',   el.toR.value));

    host.addEventListener('click', e => {
      const seg = e.target.closest('[data-seg]');
      if (seg){ state.mode = seg.dataset.seg; invalidate(); return; }
      const chip = e.target.closest('.chip[data-from],.chip[data-to]');
      if (chip){
        if (chip.dataset.from !== undefined) onSingle('from', chip.dataset.from);
        else                                 onSingle('to',   chip.dataset.to);
        return;
      }
      if (e.target.closest('.skrow') && !e.target.closest('input')){
        const i = +e.target.closest('.skrow').dataset.i;
        if (state.batch.active !== i){ state.batch.active = i; invalidate(); }
      }
    });
    host.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const name = e.target.closest('.sk-name'); if (!name) return;
      e.preventDefault();
      state.batch.active = +name.closest('.skrow').dataset.i;
      invalidate();
    });

    el.sect.addEventListener('change', () => {
      state.batch.sect = +el.sect.value;
      state.batch.active = 0;
      resetRows(); builtSect = -1; invalidate();
    });
    $('#sk-apply', host).addEventListener('click', () => {
      const a = toInt(el.defFrom.value), b = toInt(el.defTo.value);
      if (a === null || b === null) return;         // 统一设置没填完就不应用
      const f = normalize(a, b, 'to');
      state.batch.defFrom = f.from; state.batch.defTo = f.to;
      state.batch.rows.forEach(r => { r.from = f.from; r.to = f.to; });
      invalidate();
    });
    $('#sk-all', host).addEventListener('click',  () => { state.batch.rows.forEach(r => r.on = true);  invalidate(); });
    $('#sk-none', host).addEventListener('click', () => { state.batch.rows.forEach(r => r.on = false); invalidate(); });

    el.list.addEventListener('input', e => {
      const row = e.target.closest('.skrow'); if (!row) return;
      const r = state.batch.rows[+row.dataset.i];
      if (e.target.type === 'checkbox'){ r.on = e.target.checked; invalidate(); return; }
      putLevel(r, e.target.classList.contains('lv-from') ? 'from' : 'to', e.target.value);
      invalidate();
    });
    el.detail.addEventListener('toggle', () => { if (el.detail.open){ bandKey = null; invalidate(); } });

    el.sect.innerHTML = SECTS.map((s, i) =>
      `<option value="${i}">${esc(s.name)}${s.abbr ? '（' + esc(s.abbr) + '）' : ''}</option>`).join('');
    el.sect.value = '0';

    return { render };
  },
});


/* ============================================================
   4.5 工具：乾元丹（奇经八脉）
   ============================================================ */
Tools.register({
  id: 'qianyuan',
  name: '乾元丹',
  tagline: '奇经八脉乾元丹的经验与金钱消耗',
  dataId: null,
  create(ctx){
    const { host, fmt, ui, $, invalidate } = ctx;
    const { MAX, costBetween } = QianyuanEngine;

    /**
     * 下拉候选列表只放纯数字（from…to），目标下拉因此天然不含 0。
     * 未选择的状态用 hidden 占位项表达：selected 让框里显示「请选择」，
     * hidden 让它**不出现在展开的候选列表里** —— 所以列表里既没有「请选择」，也仍然能"进来不预选"。
     */
    const options = (from, to) => `<option value="" disabled selected hidden>请选择</option>` +
      Array.from({ length: to - from + 1 }, (_, i) => from + i)
        .map(n => `<option value="${n}">${n}</option>`).join('');

    const selOf = id => {
      const v = $('#' + id, host).value;
      return v === '' ? null : Math.max(0, Math.min(MAX, parseInt(v, 10) || 0));
    };

    host.innerHTML = `
      <div class="grid two" id="qy-grid">
        <div class="card">
          <h2>目标与当前</h2>
          <div class="field">
            <label class="f" for="qy-cur">当前已有乾元丹</label>
            <select id="qy-cur">${options(0, MAX - 1)}</select>
          </div>
          <div class="field" style="margin-bottom:0">
            <label class="f" for="qy-target">目标乾元丹</label>
            <select id="qy-target">${options(1, MAX)}</select>
          </div>
        </div>
        <div class="card">
          <h2>计算结果</h2>
          <div id="qy-result"></div>
        </div>
      </div>`;

    function renderPlan(){
      const cur = selOf('qy-cur'), target = selOf('qy-target');

      if (cur === null || target === null){          // 没选完不算
        $('#qy-result', host).innerHTML = ui.idle('选择当前与目标丹数后自动计算');
        return;
      }
      if (target <= cur){
        $( '#qy-result', host).innerHTML = ui.idle(
          cur === target ? `当前已经是第 ${cur} 个，无需提升。` : '目标丹数不能小于当前丹数。');
        return;
      }
      const r = costBetween(cur, target);
      let html = ui.stats([
        { k:'消耗金钱', v: fmt.cn(r.money), sub: fmt.num(r.money), tone:'gold' },
        { k:'消耗经验', v: fmt.cn(r.exp),   sub: fmt.num(r.exp),   tone:'jade' },
      ]);
      html += `<div class="summary">第 <b>${cur}</b> 个 → 第 <b>${target}</b> 个，共 <b>${r.count}</b> 个乾元丹</div>`;
      html += ui.table({
        cls: 'tall',
        head: ['乾元丹', '需等级', '金钱', '经验'],
        rows: r.steps.map(d => ({
          cells: [`第 ${d.n} 个`, `${d.level} 级`, fmt.num(d.money), fmt.num(d.exp)],
        })),
        total: ['合计', `${r.count} 个`, fmt.num(r.money), fmt.num(r.exp)],
      });
      $('#qy-result', host).innerHTML = html;
    }

    function render(){
      renderPlan();
    }

    /* ---------- 交互 ---------- */
    ['qy-cur', 'qy-target'].forEach(id => {
      const node = $('#' + id, host);
      node.addEventListener('input', invalidate);
      node.addEventListener('change', invalidate);
    });

    return { render };
  },
});

/* ============================================================
   4.6 工具：生活技能（帮派书院）
   ============================================================ */
Tools.register({
  id: 'lifeskill',
  name: '生活技能',
  tagline: '帮派书院学生活技能要多少经验 / 金钱 / 帮贡',
  dataId: 'data-skill',
  create(ctx){
    const { host, data, fmt, ui, esc, $, invalidate } = ctx;
    const { SKILLS, skillById, costBetween, bandsOf } = LifeEngine(data.cost.exp);

    /** 空串 = 还没填，一律用 null 表示（与其它三个工具同一口径） */
    const read = id => {
      const raw = $('#' + id, host).value.trim();
      if (raw === '') return null;
      const n = parseInt(raw, 10);
      return Number.isFinite(n) ? n : null;
    };
    const clampLv = (v, cap) => Math.max(0, Math.min(v, cap));

    host.innerHTML = `
      <div class="grid two" id="ls-grid">
        <div class="card">
          <h2>技能与等级</h2>
          <div class="field">
            <label class="f" for="ls-skill">生活技能</label>
            <select id="ls-skill">${SKILLS.map(s =>
              `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>
            <div class="hint" id="ls-skill-hint"></div>
          </div>
          <div class="field">
            <label class="f" for="ls-from">当前等级</label>
            <input type="number" id="ls-from" inputmode="numeric" step="1" min="0" placeholder="0 ~ 160">
            <div class="hint" id="ls-from-hint"></div>
          </div>
          <div class="field" style="margin-bottom:0">
            <label class="f" for="ls-to">目标等级</label>
            <input type="number" id="ls-to" inputmode="numeric" step="1" min="0" placeholder="0 ~ 160">
            <div class="hint" id="ls-to-hint"></div>
          </div>
        </div>
        <div class="card">
          <h2>计算结果</h2>
          <div id="ls-result"></div>
        </div>
      </div>
      <div id="ls-detail" hidden></div>`;

    const el = {
      skill: $('#ls-skill', host), from: $('#ls-from', host), to: $('#ls-to', host),
      result: $('#ls-result', host), detail: $('#ls-detail', host),
    };
    let capNotice = false;      // 上一次 change / blur 是否因超上限被夹过

    /** 只刷范围提示 / 占位，不写回输入框（写回统一走 commitInputs） */
    function applyMeta(skill){
      const range = `可填 0 ~ ${skill.cap}`;
      el.from.placeholder = range.replace('可填 ', '');
      el.to.placeholder = range.replace('可填 ', '');
      el.from.max = skill.cap; el.to.max = skill.cap;
      $('#ls-from-hint', host).textContent = range;
      $('#ls-to-hint', host).textContent = range;
      const full = costBetween(skill.id, 0, skill.cap);
      $('#ls-skill-hint', host).textContent =
        `上限 ${skill.cap} 级 · 学满共 ${fmt.cn(full.exp)} 经验 / ${fmt.cn(full.money)} 金钱`;
    }

    function render(){
      const skill = skillById(el.skill.value);
      applyMeta(skill);
      const cap = skill.cap, rawFrom = read('ls-from'), rawTo = read('ls-to');
      // 越界说明：正在输入时按当前值判断，被夹紧后靠 capNotice 记住（编辑时清除）
      const over = (rawFrom !== null && rawFrom > cap) || (rawTo !== null && rawTo > cap);
      const trimmed = (over || capNotice)
        ? ui.alert(`${esc(skill.name)}的上限为 ${cap} 级，超出的部分已按 ${cap} 级计算。`) : '';

      if (rawFrom === null || rawTo === null){                 // 没填完不算
        el.result.innerHTML = ui.idle('填写当前等级与目标等级后自动计算') + trimmed;
        el.detail.hidden = true;
        return;
      }
      const from = clampLv(rawFrom, cap), to = clampLv(rawTo, cap);

      if (to <= from){
        el.detail.hidden = true;
        el.result.innerHTML = trimmed + ui.idle(from === to
          ? `当前已经是 ${to} 级，无需提升。`
          : '目标等级不能低于当前等级。');
        return;
      }

      const r = costBetween(skill.id, from, to);
      let html = trimmed + ui.stats([
        { k:'消耗金钱',     v: fmt.cn(r.money),      sub: fmt.num(r.money),  tone:'gold' },
        { k:'消耗经验',     v: fmt.cn(r.exp),        sub: fmt.num(r.exp),    tone:'jade' },
        { k:'消耗帮贡',     v: fmt.num(r.bgUsed),    sub: `共 ${r.count} 级` },
        { k:'需要持有帮贡', v: fmt.num(r.bgNeed),    sub: '目标等级 × 5' },
      ]);
      html += `<div class="summary">${esc(skill.name)} <b>${from}</b> 级 → <b>${to}</b> 级，
        共 <b>${r.count}</b> 级</div>`;
      el.result.innerHTML = html;

      const bands = bandsOf(skill.id, from, to);
      el.detail.innerHTML = ui.card({
        title: '消耗明细（每 5 级一档）',
        body: ui.table({
          cls: 'tall',
          head: ['等级', '金钱', '经验', '帮贡'],
          rows: bands.map(b => [`${b.lo} → ${b.hi}`, fmt.num(b.money), fmt.num(b.exp), fmt.num(b.bgUsed)]),
          total: ['合计', fmt.num(r.money), fmt.num(r.exp), fmt.num(r.bgUsed)],
        }),
      });
      el.detail.hidden = false;
    }

    /** 夹紧只在 change / blur 写回，input 阶段绝不改写输入框（见 README §8.6） */
    function commitInputs(){
      const cap = skillById(el.skill.value).cap;
      let hit = false;
      [el.from, el.to].forEach(node => {
        const raw = node.value.trim();
        if (raw === '') return;
        const n = parseInt(raw, 10);
        if (!Number.isFinite(n)){ node.value = ''; return; }
        if (n > cap) hit = true;
        const c = clampLv(n, cap);
        if (String(c) !== raw) node.value = String(c);
      });
      capNotice = hit;                       // 夹过就在结果区保留一句说明
    }

    el.skill.addEventListener('change', () => { commitInputs(); invalidate(); });
    [el.from, el.to].forEach(node => {
      node.addEventListener('input',  () => { capNotice = false; invalidate(); });
      node.addEventListener('change', () => { commitInputs(); invalidate(); });
      node.addEventListener('blur',   () => { commitInputs(); invalidate(); });
    });

    return { render };
  },
});
